[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tide"
version = "0.1.0"
description = "Temporal Inference of Dependencies in Agent Swarms research prototype"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "TIDE Hackathon Prototype" }]
dependencies = [
    "matplotlib>=3.8",
    "adaption>=0.19.0",
    "tqdm>=4.66",
    "igraph>=0.11,<2",
]

[project.optional-dependencies]
pass2 = ["numpy>=1.26", "torch>=2.2", "transformers>=4.51", "peft>=0.14"]

[tool.setuptools]
packages = ["tide"]

[tool.uv.sources]
torch = [
	{ index = "pytorch-cu128", marker = "sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
