[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tide"
version = "0.1.0"
description = "Temporal Inference of Dependencies in Agent Swarms research prototype"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "TIDE Hackathon Prototype" }]
dependencies = ["matplotlib>=3.8", "adaption>=0.19.0", "tqdm>=4.66"]

[project.optional-dependencies]
pass2 = ["numpy>=1.26", "torch>=2.2", "transformers>=4.51"]

[tool.setuptools]
packages = ["tide"]
